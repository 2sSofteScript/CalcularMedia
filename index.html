<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Calcular Média</title>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="home " id="container">

        <h1> CALCULAR MÉDIA DO ALUNO </h1>
        <p class="description ">Digite suas notas e obtenha a média</p>
        <!--Entrada Nome do Aluno-->

        <form action="" id="form">
            <div class="inputBox">
                <div class="input-nota">
                    <label class="description ">Nome do Aluno:</label>
                    <input class="input" type="text" name="nome_aluno" id="inputNome" placeholder="Seu Nome">
                </div>
                <span class="error"></span>
            </div>
            <!--Entrada Nome do Aluno-->

            <!-- Entrada Primeira Nota do Aluno -->
            <div class="inputBox">
                <div class="input-nota">
                    <label class="description ">Primeira nota:</label>
                    <input class="input" type="number" step="any" name="txtn1" id="txtn1" placeholder="Primeira Nota">
                </div>
                <span class="error"></span>
            </div>

            <!-- Entrada Segunda Nota do Aluno -->
            <div class="inputBox">
                <div class="input-nota">
                    <label class="description ">Segunda nota:</label>
                    <input class="input" type="number" step="any" name="txtn2" id="txtn2" placeholder="Segunda Nota">
                </div>
                <span class="error"></span>
            </div>

            <button id="btn-somar" type="submit" value="calcularMedia">Calcular Média</button>
            <!--Botão Somar Nota do Aluno -->


        </form>

        <div id="resultado">

        </div>
        <!--Mostra as Notas Inseridas Pelo Usuário-->

        <div id="media">

        </div>
        <!--Mostra a Média Usuário-->

        <div class="horarioBr">

        </div>

    </div>

    <div class="div-footer">
        <span class="span-footer">

            <footer class="footer"> Desenvolvido por: Allesson Almeida | &copy; DevOps</footer>
            <p class="nota">ATENÇÃO! A média do aluno é calculada usando apenas 2 notas.</p>
        </span>
        <!--Rodapé do website-->
    </div>
    <script src="./javascript/script.js"></script>
</body>

</html>
